[project]
name = "trender-analitic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "AgustinRT", email = "a.rodilla.tierz@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic>=2.14.2",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
trender-analitic = "trender_analitic:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "testcontainers[postgres]>=4.15.0",
]
